[project]
name = "evaluation"
authors = [
    { name = "Aljahmi", email = "gihadalgahmi@gmail.com" }
]
description = "Enemy reconnaissance: order of battle, daily observations, targets, and situation"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe is provided by the bench framework, not installed from PyPI here.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "evaluation"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
